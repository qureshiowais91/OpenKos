# OpenKOS single-service deployment on Render.
# One web service runs FrankenPHP, the queue worker, and the scheduler in one
# container from the production image; Postgres is a managed Render database.
services:
    - type: web
      name: openkos
      runtime: docker
      dockerfilePath: .docker/php/Dockerfile.prod
      dockerCommand: /usr/local/bin/openkos-render
      plan: 1c-2g
      healthCheckPath: /up
      maxShutdownDelaySeconds: 60
      preDeployCommand: php artisan migrate --force
      disk:
          name: uploads
          mountPath: /app/storage/app/private
          sizeGB: 2
      envVars:
          - key: APP_ENV
            value: production
          - key: APP_DEBUG
            value: 'false'
          - key: APP_KEY
            generateValue: true
          - key: APP_URL
            sync: false
          - key: TRUSTED_PROXIES
            value: '*'
          - key: DB_CONNECTION
            value: pgsql
          - key: DB_URL
            fromDatabase:
                name: openkos-db
                property: connectionString
          - key: SESSION_DRIVER
            value: database
          - key: CACHE_STORE
            value: database
          - key: QUEUE_CONNECTION
            value: database
          - key: LOG_CHANNEL
            value: stderr
          - key: LARAVEL_OPTIMIZE
            value: 'true'

databases:
    - name: openkos-db
      plan: 0.5c-1g
